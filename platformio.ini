; Wraith fog-machine controller firmware — ESP32-C3
; PlatformIO + Arduino-ESP32. See README.md and docs/ARCHITECTURE.md.

[platformio]
default_envs = esp32c3

[env:esp32c3]
; Versions are pinned so a rebuild can't silently pull different code.
; pioarduino: community fork of platform-espressif32 that tracks current
; Arduino-ESP32 3.x / ESP-IDF 5.x on the C3 (the stock platformio/espressif32
; lags). It comes from git, not the registry, so it can't take a version range:
; it is pinned to a release tag (which also fixes the Arduino core, 3.3.12).
; Bump it deliberately, then rebuild + retest (BLE, Wi-Fi, MQTT, OTA).
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA-capable layout + LittleFS for the web UI assets (data/).
board_build.partitions = partitions_ota.csv
board_build.filesystem = littlefs

; build_number.py: stamps the firmware build number (WRAITH_FW_BUILD) as the
;   UTC time yymmddHHMM; OTA refuses an image older than the device's floor.
;   Pin a number with: WRAITH_FW_BUILD=<n> pio run
; pio_ota.py: signs every build (firmware.bin.sig, needs the private key in
;   tools/ota) and adds `pio run -t ota` (build, sign, upload over Wi-Fi to
;   custom_ota_host, or WRAITH_HOST=<ip or name.local>).
extra_scripts =
    pre:tools/build_number.py
    post:tools/ota/pio_ota.py
custom_ota_host = wraith.local

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Quiet NimBLE's per-advertisement INFO logs (WARN); our own logs stay at 3.
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    ; MQTT over TLS (mqtts / wss) needs ~40 KB of free heap per session with this
    ; core's fixed 16 KB mbedTLS buffers; an ESP32-C3 running BLE + Wi-Fi + the
    ; web server has ~38 KB, so it's off here (plain MQTT + WebSocket remain).
    ; Set 1 on a board with PSRAM, or with a custom sdkconfig using dynamic TLS
    ; buffers (CONFIG_MBEDTLS_DYNAMIC_BUFFER).
    -DWRAITH_MQTT_TLS=0
    ; NimBLE roles are set by the Arduino-ESP32 core's sdkconfig on this platform.
    ; Defining them here only produced redefinition warnings, so they're omitted.

; Libraries: "~X.Y.Z" takes patch (bug-fix) releases only, never a new minor or
; major version (the firmware relies on specific library behaviour).
lib_deps =
    ; NimBLE 2.x is required for Arduino-ESP32 3.x / IDF 5.x (1.4.x crashes at BLE init).
    h2zero/NimBLE-Arduino @ ~2.5.1
    esp32async/ESPAsyncWebServer @ ~3.12.1
    esp32async/AsyncTCP @ ~3.5.0
    bblanchon/ArduinoJson @ ~7.4.3
    ; MQTT uses ESP-IDF's built-in esp-mqtt client (TCP / TLS / WebSocket).

; Host-side unit tests (no BLE / Wi-Fi): one suite per test/<suite>/ folder, each
; a plain C++ program run by test/test_custom_runner.py.
; Run: pio test -e native -e native_tls
[env:native]
platform = native
test_framework = custom
build_flags = -std=c++17 -Wall -Wextra -Iinclude -Isrc

; Same suites with the MQTT TLS build capability on (see WRAITH_MQTT_TLS above).
[env:native_tls]
extends = env:native
build_flags = ${env:native.build_flags} -DWRAITH_MQTT_TLS=1
