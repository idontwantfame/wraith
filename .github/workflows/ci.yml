name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/build

      # Unsigned: CI has no access to the signing key. Releases are signed.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/esp32c3/firmware.bin
            .pio/build/esp32c3/firmware.factory.bin
            .pio/build/esp32c3/littlefs.bin
          if-no-files-found: error
          retention-days: 14
