name: Test and build
description: Set up a pinned PlatformIO, run the host tests, build the firmware (web UI included).

inputs:
  cache:
    description: Restore / save the PlatformIO package cache. Releases build without it, from fresh downloads.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Cache PlatformIO packages
      if: inputs.cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
        restore-keys: platformio-${{ runner.os }}-

    - name: Install PlatformIO
      shell: bash
      run: pip install platformio==6.2.0

    - name: Host unit tests
      shell: bash
      run: pio test -e native -e native_tls

    - name: Check the web UI script
      shell: bash
      run: node --check data/app.js

    - name: Build the firmware (web UI included)
      shell: bash
      run: pio run
